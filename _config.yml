# Site settings
title: SFB Lab
email: example@gmail.com
description: >-
  Structural and Functional Genomics Lab
# Project site: https://Tomasz-Lab.github.io/tomaszlab-website/
# The Pages workflow overrides baseurl with the live base path.
baseurl: "/tomaszlab-website"
url: "https://tomasz-lab.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
sass:
  style: expanded
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/
  # People on /members/. output is false: the bio expands on that page,
  # so a member file does not get its own URL.
  members:
    output: false

# Google Analytics 4 measurement ID (G-XXXXXXXXXX). Leave empty to disable.
# Only emitted in production builds (JEKYLL_ENV=production, set by the Pages
# workflow), so local `jekyll serve` traffic isn't counted.
google_analytics: ""

# SEO settings
lang: en
author:
  name: TomaszLab

# Additional same-origin URLs to include in sitemap.xml
# Paths on this site. Other zeikar.dev subsites are separate repos and are not copied here.
# Labels for the project index filters. A project sets the same string in `stack:`.
project_stacks:
  - Function prediction methods
  - Microbiome Resources
  - Tools

extra_sitemap_urls:
  - /projects/
  - /members/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
